<text x="58.7" y="387.4" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="start">Robot this far around the arc:</text>
<text x="58.7" y="412.1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">15 deg around: crosses the lip 20 mm left</text>
<text x="58.7" y="436.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">32 deg around: crosses the lip 47 mm left</text>
<text x="58.7" y="461.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">45 deg around: crosses the lip 75 mm left</text>
<text x="58.7" y="486.2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">55 deg around: crosses the lip 107 mm left</text>
<line x1="30.0" y1="739.0" x2="1570.0" y2="739.0" stroke="#999999" stroke-width="1.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="40.0" y="767.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Option D</text>
<text x="40.0" y="792.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">Every aim line points at the aim point (ringed</text>
<text x="40.0" y="818.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">cross), the middle of the cell floor, 75 mm</text>
<text x="40.0" y="844.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">behind the lip. Where a line crosses the lip</text>
<text x="40.0" y="869.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">(black dot) moves toward your side the farther</text>
<text x="40.0" y="895.2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">around the arc you are.</text>
<text x="553.3" y="767.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">The rule</text>
<text x="553.3" y="792.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">The sideways shift at the lip grows with how far</text>
<text x="553.3" y="818.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">around you are. At 45 degrees it equals the aim</text>
<text x="553.3" y="844.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">depth: 75 mm. Change the aim depth setting and</text>
<text x="553.3" y="869.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">every shift grows or shrinks in proportion.</text>
<text x="1066.7" y="767.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Reading it</text>
<text x="1066.7" y="792.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">Ruler marks along the lip are 10 mm apart,</text>
<text x="1066.7" y="818.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">numbered every 50 mm from the lip's middle.</text>
<text x="1066.7" y="844.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">Robots on the right half of the arc are the</text>
<text x="1066.7" y="869.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">mirror image.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1213" viewBox="0 0 1600 1213">
<rect x="0" y="0" width="1600" height="1213" fill="#ffffff"/>
<text x="800.0" y="44.0" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" fill="#000000" text-anchor="middle">The "camera turned 1 degree" problem, and how one teach press cancels it</text>
<text x="800.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#333333" text-anchor="middle">Seen from above, cell at the top of each panel. The camera is bolted on turned 1 degree to the left, as you look out the robot's back.</text>
<rect x="30.0" y="130.0" width="500.0" height="820.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#666666" stroke-width="2"/>
<text x="280.0" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">A. Without teaching</text>
<text x="280.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#333333" text-anchor="middle">The code believes camera = robot</text>
<circle cx="280.0" cy="280.0" r="13.0" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="3"/>
<line x1="260.5" y1="280.0" x2="299.5" y2="280.0" stroke="#000000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="280.0" y1="260.5" x2="280.0" y2="299.5" stroke="#000000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="256.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="end">aim point</text>
<polygon points="353.4,524.7 224.7,506.6 206.6,635.3 335.3,653.4" fill="#b8b8b8" fill-opacity="1.0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="353.4" y1="524.7" x2="224.7" y2="506.6" stroke="#000000" stroke-width="10" stroke-opacity="1.0" stroke-linecap="round"/>
<polygon points="306.0,504.6 272.0,504.6 272.0,526.6 306.0,526.6" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="289.0" cy="504.6" r="5.5" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="1.5"/>
<line x1="289.0" y1="515.6" x2="326.0" y2="252.6" stroke="#000000" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="515.6" x2="289.0" y2="503.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="495.6" x2="289.0" y2="483.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="475.6" x2="289.0" y2="463.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="455.6" x2="289.0" y2="443.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="435.6" x2="289.0" y2="423.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="415.6" x2="289.0" y2="403.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="395.6" x2="289.0" y2="383.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="375.6" x2="289.0" y2="363.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="355.6" x2="289.0" y2="343.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="335.6" x2="289.0" y2="323.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="289.0" y1="315.6" x2="289.0" y2="303.6" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="338.0" y="264.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="start">back points here</text>
<text x="264.0" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="end">camera looks here</text>
<text x="54.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">The camera sees the aim point a little to the</text>
<text x="54.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">right of its own straight-ahead. The code thinks</text>
<text x="54.0" y="808.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">the camera looks exactly where the robot's back</text>
<text x="54.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">points, so it turns the robot until the camera</text>
<text x="54.0" y="856.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">looks straight at the aim point. Result: the</text>
<text x="54.0" y="880.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">back points about 0.85 degrees right. Every shot</text>
<text x="54.0" y="904.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">drifts right.</text>
<rect x="550.0" y="130.0" width="500.0" height="820.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#666666" stroke-width="2"/>
<text x="800.0" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">B. The teach press, on the primary</text>
<text x="800.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#333333" text-anchor="middle">The back is known to point at the cell</text>
<circle cx="800.0" cy="280.0" r="13.0" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="3"/>
<line x1="780.5" y1="280.0" x2="819.5" y2="280.0" stroke="#000000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="800.0" y1="260.5" x2="800.0" y2="299.5" stroke="#000000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="824.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="start">aim point</text>
<polygon points="865.0,515.0 735.0,515.0 735.0,645.0 865.0,645.0" fill="#b8b8b8" fill-opacity="1.0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="865.0" y1="515.0" x2="735.0" y2="515.0" stroke="#000000" stroke-width="10" stroke-opacity="1.0" stroke-linecap="round"/>
<polygon points="815.3,501.7 781.6,506.5 784.7,528.3 818.4,523.5" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="798.5" cy="504.1" r="5.5" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="1.5"/>
<line x1="800.0" y1="515.0" x2="800.0" y2="300.0" stroke="#000000" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="800.0" y1="515.0" x2="798.3" y2="503.1" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="797.2" y1="495.2" x2="795.5" y2="483.3" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="794.4" y1="475.4" x2="792.8" y2="463.5" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="791.6" y1="455.6" x2="790.0" y2="443.7" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="788.9" y1="435.8" x2="787.2" y2="423.9" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="786.1" y1="416.0" x2="784.4" y2="404.1" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="783.3" y1="396.2" x2="781.6" y2="384.3" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="780.5" y1="376.4" x2="778.8" y2="364.5" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="777.7" y1="356.6" x2="776.1" y2="344.7" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="774.9" y1="336.8" x2="773.3" y2="324.9" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="772.2" y1="316.9" x2="770.5" y2="305.1" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="769.4" y1="297.1" x2="767.7" y2="285.3" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="766.6" y1="277.3" x2="765.9" y2="272.4" stroke="#000000" stroke-width="2.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="754.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="end">camera's</text>
<text x="754.0" y="343.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="end">straight-ahead</text>
<rect x="816.0" y="341.0" width="168.5" height="82.2" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="1.5"/>
<text x="826.0" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">camera reads:</text>
<text x="826.0" y="388.4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">"aim point is</text>
<text x="826.0" y="411.8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">0.85 deg right"</text>
<text x="574.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">Here you KNOW the back points exactly at the aim</text>
<text x="574.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">point: the robot is square against the wall, on</text>
<text x="574.0" y="808.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">the cell's center line, where you hit 40 of 40.</text>
<text x="574.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">The camera still says "0.85 degrees right". The</text>
<text x="574.0" y="856.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">press saves that number: "0.85 degrees right</text>
<text x="574.0" y="880.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">means on target."</text>
<rect x="1070.0" y="130.0" width="500.0" height="820.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#666666" stroke-width="2"/>
<text x="1320.0" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">C. Any spot on the arc, after teaching</text>
<text x="1320.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#333333" text-anchor="middle">The saved number is taken off every time</text>
<circle cx="1320.0" cy="280.0" r="13.0" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="3"/>
<line x1="1300.5" y1="280.0" x2="1339.5" y2="280.0" stroke="#000000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="1320.0" y1="260.5" x2="1320.0" y2="299.5" stroke="#000000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="1344.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="start">aim point</text>
<polygon points="1421.4,493.6 1303.6,548.6 1358.6,666.4 1476.4,611.4" fill="#b8b8b8" fill-opacity="1.0" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="1421.4" y1="493.6" x2="1303.6" y2="548.6" stroke="#000000" stroke-width="10" stroke-opacity="1.0" stroke-linecap="round"/>
<polygon points="1370.8,502.6 1342.3,521.1 1354.3,539.6 1382.8,521.1" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1356.5" cy="511.9" r="5.5" fill="#ffffff" fill-opacity="1.0" stroke="#000000" stroke-width="1.5"/>
<line x1="1362.5" y1="521.1" x2="1323.5" y2="299.7" stroke="#000000" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="1094.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">At a side spot the camera reads, say, "aim point</text>
<text x="1094.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">is 3.85 degrees right". The code takes away the</text>
<text x="1094.0" y="808.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">saved 0.85: 3.85 - 0.85 = turn 3 degrees. That</text>
<text x="1094.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">is exactly the turn needed. Result: the back</text>
<text x="1094.0" y="856.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">points exactly at the aim point, on any spot, at</text>
<text x="1094.0" y="880.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">any cell.</text>
<line x1="30.0" y1="992.0" x2="1570.0" y2="992.0" stroke="#999999" stroke-width="1.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="40.0" y="1020.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Lines</text>
<text x="40.0" y="1045.7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">Solid line = where the robot's back really</text>
<text x="40.0" y="1071.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">points. Dashed line = where the camera looks.</text>
<text x="40.0" y="1097.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">Ringed cross = the aim point. Thick edge = the</text>
<text x="40.0" y="1122.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">robot's back (shooters); the black box on it is</text>
<text x="40.0" y="1148.2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">the camera.</text>
<text x="553.3" y="1020.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Angles</text>
<text x="553.3" y="1045.7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">The 1 degree error is drawn 8 times larger so</text>
<text x="553.3" y="1071.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">you can see it. Real size: about 0.85 degrees of</text>
<text x="553.3" y="1097.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">aim, or about 16 mm sideways at the opening.</text>
<text x="1066.7" y="1020.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Why it cancels</text>
<text x="1066.7" y="1045.7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">The error is between the camera and the robot.</text>
<text x="1066.7" y="1071.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">It doesn't depend on where the robot is, so the</text>
<text x="1066.7" y="1097.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">number saved on the primary fits every spot.</text>
</svg>

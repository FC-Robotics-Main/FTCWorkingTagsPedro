<text x="1094.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="start">Hollow circle = where</text>
<text x="1094.0" y="273.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="start">the code thinks the</text>
<text x="1094.0" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="start">tags are</text>
<text x="1094.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">Around the arc the tags are the same height</text>
<text x="1094.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">above the camera, so the code is off by the same</text>
<text x="1094.0" y="808.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">18 mm in the same direction. It snaps to a</text>
<text x="1094.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">reading of 1203 mm, which is truly 1186 mm: just</text>
<text x="1094.0" y="856.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">right.</text>
<line x1="30.0" y1="932.0" x2="1570.0" y2="932.0" stroke="#999999" stroke-width="1.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="40.0" y="960.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Lines</text>
<text x="40.0" y="985.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">Solid line = the real line from the camera to</text>
<text x="40.0" y="1011.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">the tags. Dashed line and hollow circle = where</text>
<text x="40.0" y="1037.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">the code thinks the tags are. Black box = the</text>
<text x="40.0" y="1062.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">camera, on the robot's back.</text>
<text x="553.3" y="960.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Angles</text>
<text x="553.3" y="985.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">The 1 degree error is drawn 6 times larger. Real</text>
<text x="553.3" y="1011.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">size: the code puts the tags about 18 mm too far</text>
<text x="553.3" y="1037.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">away and 19 mm too low.</text>
<text x="1066.7" y="960.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="start">Why it cancels</text>
<text x="1066.7" y="985.6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">The tags are about 1.0 m above the camera from</text>
<text x="1066.7" y="1011.3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">every spot on the arc, so a 1 degree tilt error</text>
<text x="1066.7" y="1037.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#000000" text-anchor="start">shifts the reading by the same 18 mm everywhere.</text>
</svg>

<text x="800.0" y="44.0" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" fill="#000000" text-anchor="middle">The "camera tilted 1 degree" problem, and how the same press cancels it</text>
<text x="800.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#333333" text-anchor="middle">Seen from the side, cell to the right. The camera is really tilted up 45 degrees, but the code was told 44.</text>

<text x="580.0" y="713.4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">the real distance is 1186 mm</text>
<text x="574.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">On the primary you KNOW the distance is right.</text>
<text x="574.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">The press saves what the camera reads there,</text>
<text x="574.0" y="808.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">1203 mm, as "the right distance". The true</text>
<text x="574.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">number, 1186 mm, never matters.</text>
<rect x="1070.0" y="130.0" width="500.0" height="760.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#666666" stroke-width="2"/>
<text x="1320.0" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">C. Any spot on the arc, after teaching</text>
<text x="1320.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#333333" text-anchor="middle">The same error, so it cancels</text>

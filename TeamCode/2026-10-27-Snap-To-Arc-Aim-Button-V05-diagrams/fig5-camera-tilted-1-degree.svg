<text x="54.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">The code reads the tags as farther away than</text>
<text x="54.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">they are (1203 mm instead of 1186 mm), so the</text>
<text x="54.0" y="808.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">snap reverses the robot about 18 mm too close to</text>
<text x="54.0" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#000000" text-anchor="start">the cell. Shots land a little long.</text>
